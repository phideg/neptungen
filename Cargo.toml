[package]
name = "neptungen"
version = "0.11.3"
description = "Yet another static Website Generator"
repository = "https://github.com/phideg/neptungen"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["static", "site", "generator", "liquid", "ftp"]
categories = [
    "development-tools::testing",
    "web-programming::http-server",
    "command-line-utilities",
]
authors = ["Philipp Degler <deglerp@googlemail.com>"]
edition = "2024"
rust-version = "1.98"

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[[bin]]
name = "neptungen"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
liquid = "0.26.11"
log = "0.4.34"
image = "0.25.10"
flexi_logger = "0.31.10"
memmap = "0.7.0"
portpicker = "0.1.1"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
regex = "1.13.1"
rpassword = "7.5.4"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
sha1 = "0.11.0"
ssh2 = "0.9.6"
suppaftp = "12.1.1"
term-painter = "0.4.0"
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread"] }
time = { version = "0.3.55", features = ["local-offset"] }
toml = "1.1.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
walkdir = "2.5.0"
